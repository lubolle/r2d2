<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache">
  <!-- Al publicar cambios, subir la versión en app.js?v=, los imports de protocol.js?v= y audio.js?v=, y #version. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1020">
  <title>Control R2-D2</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #151c33;
      --text: #f2f4fb;
      --muted: #8f9bbd;
      --blue: #2f6fe4;
      --red: #e0393e;
      --green: #2fbf71;
      --amber: #f0b429;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 600 16px/1.2 system-ui, -apple-system, sans-serif;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      gap: 10px;
    }
    button, label { touch-action: manipulation; font: inherit; color: inherit; }
    button { border: 0; border-radius: 14px; cursor: pointer; }
    button:active { transform: scale(.96); }

    header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    #connect { background: var(--blue); padding: 12px 18px; }
    #status { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    #status::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--red); }
    [data-status=connecting] #status::before { background: var(--amber); }
    [data-status=connected] #status::before { background: var(--green); }
    #version { color: var(--muted); font-size: 11px; font-weight: 400; opacity: .6; }
    #reply { color: var(--muted); font-size: 12px; font-weight: 400; }
    .spacer { flex: 1; }
    #slowLabel { display: flex; align-items: center; gap: 6px; background: var(--panel); padding: 10px 14px; border-radius: 14px; }
    #slow { width: 20px; height: 20px; }
    #stop { background: var(--red); padding: 12px 22px; font-size: 18px; letter-spacing: .05em; }
    #message { background: #3a2a10; color: #ffd98a; padding: 10px 14px; border-radius: 12px; margin: 0; }

    main { flex: 1; min-height: 0; display: flex; gap: 14px; }
    #left { flex: 1; display: flex; align-items: center; justify-content: center; }
    #joystick {
      position: relative;
      width: min(80vmin, 340px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: url(images/joystick-base.png) center / contain no-repeat;
      touch-action: none;
    }
    #knob {
      position: absolute;
      inset: 25%;
      background: url(images/joystick-red.png) center / contain no-repeat;
      pointer-events: none;
    }
    [data-status=disconnected] #joystick { opacity: .5; }

    #right { flex: 1; min-width: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #sounds, #mystery { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
    .sound {
      background: var(--panel);
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 14px;
    }
    .sound .emoji { font-size: 28px; }
    .sound.small { font-size: 14px; padding: 12px 6px; }
    [data-status=disconnected] .sound { opacity: .5; }
    details { margin-top: 12px; color: var(--muted); }
    summary { padding: 8px 0; }

    #debugToggle { background: var(--panel); padding: 12px 14px; }
    #debug {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      max-height: 60vh;
      overflow-y: auto;
      background: #070b17;
      border-top: 2px solid var(--blue);
      padding: 12px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      z-index: 10;
    }
    #debug[hidden] { display: none; }
    #debug .tests { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    #debug .tests button { background: var(--panel); padding: 10px 12px; font-size: 14px; }
    #debug .hint { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    #target { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    #log { margin: 0; font: 12px/1.4 ui-monospace, Menlo, monospace; color: #b8c4e6; white-space: pre-wrap; user-select: text; -webkit-user-select: text; }

    #custom { background: var(--panel); border-radius: 14px; padding: 8px; margin-bottom: 10px; }
    #custom .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
    #custom .row + .row { margin-top: 8px; }
    #custom .row[hidden] { display: none; }
    #custom .sound { background: #24305a; min-width: 92px; }
    #custom .tool { flex: 1; min-width: 120px; display: flex; align-items: center; justify-content: center; background: #1d2645; border-radius: 14px; padding: 10px; font-size: 14px; cursor: pointer; }
    #custom .tool.primary { background: var(--blue); }
    #custom .tool.recording { background: var(--red); }
    #custom .tool:disabled { opacity: .5; }
    #customProgress { width: 100%; margin-top: 8px; }
    #customStatus { color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 6px; }
    #customStatus:empty { display: none; }

    @media (orientation: portrait) {
      main { flex-direction: column; }
      #left { flex: none; padding: 8px 0; }
      #joystick { width: min(70vw, 320px); }
    }
  </style>
</head>
<body data-status="disconnected">
  <header>
    <button id="connect">Conectar</button>
    <span id="status">Desconectado</span>
    <span id="reply"></span>
    <span id="version">v10</span>
    <span class="spacer"></span>
    <label id="slowLabel"><input type="checkbox" id="slow"> 🐢 Lento</label>
    <button id="stop">STOP</button>
    <button id="debugToggle" aria-label="Diagnóstico">🔧</button>
  </header>
  <p id="message" hidden></p>
  <main>
    <div id="left">
      <div id="joystick"><div id="knob"></div></div>
    </div>
    <div id="right">
      <section id="custom">
        <div class="row">
          <button class="sound" id="customPlay"><span class="emoji">⭐</span><span>mi sonido</span></button>
          <button class="tool" id="customRecord">🎙️ Grabar</button>
          <label class="tool">📁 Elegir audio<input type="file" id="customFile" accept="audio/*" hidden></label>
        </div>
        <div class="row" id="customReady" hidden>
          <button class="tool" id="customPreview">👂 Escuchar acá</button>
          <button class="tool primary" id="customUpload">⬆️ Mandar al R2</button>
        </div>
        <progress id="customProgress" max="1" value="0" hidden></progress>
        <div id="customStatus"></div>
      </section>
      <div id="sounds"></div>
      <details>
        <summary>Sonidos misteriosos</summary>
        <div id="mystery"></div>
      </details>
    </div>
  </main>
  <section id="debug" hidden>
    <div class="hint">Probar puerto (1 s):</div>
    <div class="tests" id="tests"></div>
    <div id="target">giro 0 · avance 0</div>
    <pre id="log"></pre>
  </section>
  <script type="module" src="app.js?v=10"></script>
</body>
</html>
